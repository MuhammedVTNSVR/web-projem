<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Muhammed Vatansever</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .form-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .error-text { color: red; font-size: 0.85rem; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Muhammed Vatansever</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Takımımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-2" href="login.html">Giriş</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" id="app">
        <div class="row justify-content-center">
            <div class="col-md-8 form-container">
                <h2 class="text-center mb-4 fw-bold">İletişim Formu</h2>
                
                <form id="contactForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Adınız</label>
                            <input type="text" v-model="form.ad" class="form-control" id="ad">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Soyadınız</label>
                            <input type="text" v-model="form.soyad" class="form-control" id="soyad">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-posta Adresi</label>
                        <input type="email" v-model="form.email" class="form-control" id="email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cinsiyet</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" v-model="form.cinsiyet" value="Erkek">
                            <label class="form-check-label">Erkek</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" v-model="form.cinsiyet" value="Kadın">
                            <label class="form-check-label">Kadın</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mesajınız</label>
                        <textarea class="form-control" v-model="form.mesaj" rows="4" id="mesaj"></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="button" @click="vueKontrol" class="btn btn-success">Vue.js ile Gönder (Framework Kontrol)</button>
                        <button type="button" onclick="jsKontrol()" class="btn btn-secondary">Normal JS ile Gönder</button>
                        <button type="reset" class="btn btn-outline-danger">Temizle</button>
                    </div>
                </form>

                <div v-if="gonderildi" class="alert alert-info mt-4">
                    <h5>Form Verileri Alındı:</h5>
                    <p>Ad Soyad: {{ form.ad }} {{ form.soyad }}</p>
                    <p>E-posta: {{ form.email }}</p>
                    <p>Mesaj: {{ form.mesaj }}</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. NORMAL JAVASCRIPT KONTROLÜ (Hocanın istediği ilk yöntem)
        function jsKontrol() {
            var ad = document.getElementById('ad').value;
            var email = document.getElementById('email').value;
            
            if(ad == "" || email == "") {
                alert("Lütfen isim ve e-posta alanlarını boş bırakmayın!");
            } else if(!email.includes("@")) {
                alert("Geçerli bir e-posta adresi girin!");
            } else {
                alert("Normal JS Kontrolü: Başarılı!");
            }
        }

        // 2. VUE.JS KONTROLÜ (Hocanın istediği Framework yöntemi)
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    gonderildi: false,
                    form: {
                        ad: '',
                        soyad: '',
                        email: '',
                        cinsiyet: '',
                        mesaj: ''
                    }
                }
            },
            methods: {
                vueKontrol() {
                    if(this.form.ad && this.form.email && this.form.mesaj) {
                        this.gonderildi = true;
                        console.log("Vue.js Form Verisi:", this.form);
                    } else {
                        alert("Vue.js uyarısı: Eksik alanları doldurun!");
                    }
                }
            }
        }).mount('#app')
    </script>

</body>
</html>
