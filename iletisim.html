<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Muhammed Vatansever</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .contact-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #444; }
        .section-title { border-left: 5px solid #198754; padding-left: 15px; margin-bottom: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Muhammed Vatansever</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Takımımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active text-success" href="iletisim.html">İletişim</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" id="app">
        <div class="contact-container">
            <h2 class="section-title text-success text-center">İletişim Formu</h2>
            
            <form id="contactForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Adınız</label>
                        <input type="text" v-model="ad" id="name" class="form-control" placeholder="Adınız">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Soyadınız</label>
                        <input type="text" v-model="soyad" id="surname" class="form-control" placeholder="Soyadınız">
                    </div>
                    <div class="col-12">
                        <label class="form-label">E-posta Adresi</label>
                        <input type="email" v-model="email" id="email" class="form-control" placeholder="muhammed@example.com">
                    </div>
                    <div class="col-12">
                        <label class="form-label d-block">Cinsiyet</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" v-model="cinsiyet" value="Erkek" id="erkek">
                            <label class="form-check-label" for="erkek">Erkek</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" v-model="cinsiyet" value="Kadın" id="kadin">
                            <label class="form-check-label" for="kadin">Kadın</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mesajınız</label>
                        <textarea class="form-control" v-model="mesaj" id="message" rows="4" placeholder="Mesajınızı buraya yazın..."></textarea>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="button" @click="vueKontrol" class="btn btn-success w-100 mb-2 py-2 fw-bold">
                            Vue.js ile Gönder (Framework Kontrol)
                        </button>
                        <button type="button" onclick="nativeJSKontrol()" class="btn btn-secondary w-100 mb-2 py-2">
                            Normal JS ile Gönder
                        </button>
                        <button type="reset" @click="temizle" class="btn btn-outline-danger w-100 py-2">
                            Temizle
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer class="text-center py-4 bg-white border-top mt-5">
        <p class="mb-0 text-secondary">B251210574 - Muhammed Vatansever</p>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        // --- 1. VUE.JS KONTROLÜ (Ödev Şartı) ---
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    ad: '',
                    soyad: '',
                    email: '',
                    cinsiyet: '',
                    mesaj: ''
                }
            },
            methods: {
                vueKontrol() {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    
                    if (!this.ad || !this.soyad || !this.email || !this.mesaj) {
                        alert("HATA (Vue.js): Lütfen tüm alanları doldurunuz!");
                    } else if (!emailRegex.test(this.email)) {
                        alert("HATA (Vue.js): Geçersiz e-posta formatı!");
                    } else {
                        alert("BAŞARILI (Vue.js): Form doğrulandı. Bilgiler gönderiliyor...");
                        // Formu PHP sayfasına yönlendirmek istersen:
                        // document.getElementById('contactForm').submit();
                    }
                },
                temizle() {
                    this.ad = ''; this.soyad = ''; this.email = ''; this.cinsiyet = ''; this.mesaj = '';
                }
            }
        }).mount('#app')

        // --- 2. NATIVE JS KONTROLÜ (Ödev Şartı) ---
        function nativeJSKontrol() {
            const ad = document.getElementById('name').value;
            const soyad = document.getElementById('surname').value;
            const email = document.getElementById('email').value;
            
            if (ad === "" || soyad === "" || email === "") {
                alert("HATA (Native JS): Boş alan bırakmayınız!");
            } else {
                alert("BAŞARILI (Native JS): Kontrol sağlandı!");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
