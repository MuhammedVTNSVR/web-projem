<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Muhammed Vatansever</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { color: #198754; font-weight: bold; margin-bottom: 30px; text-align: center; }
        .btn-success { background-color: #198754; border: none; padding: 12px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-success:hover { background-color: #146c43; transform: translateY(-2px); }
        .form-label { font-weight: 500; color: #444; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Öğrenci Girişi</h2>
        <form action="login.php" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Kullanıcı Adı (E-postanız)</label>
                <input type="email" name="username" class="form-control" id="username" placeholder="g251210xxx@sakarya.edu.tr" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" id="password" placeholder="Şifreniz" required>
            </div>
            <button type="submit" class="btn btn-success">Giriş Yap</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
